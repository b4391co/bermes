name: hermes_pocket
description: "Hermes Pocket — cliente Android para Hermes Agent de Nous Research."
publish_to: 'none'
version: 0.1.48+48

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y arquitectura
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0

  # Red / protocolo
  dio: ^5.9.0
  web_socket_channel: ^3.0.0

  # Persistencia
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secretos
  flutter_secure_storage: ^10.0.0

  # Utilidades
  uuid: ^4.5.0
  intl: ^0.20.0
  collection: ^1.19.0
  meta: ^1.16.0
  dartssh2: ^4.1.0
  xterm2: ^5.2.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  gpt_markdown: ^1.3.0
  file_picker: ^13.1.0
  # Nota de voz: grabación local (m4a/AAC en Android, m4a en iOS) que se
  # transcribe contra el gateway. Sólo grabación; sin reproductor: el Pocket
  # nunca promete oír audio (el backend no lo persiste).
  # record 5.x arrastra record_linux 0.7.2, que exige un platform_interface
  # más nuevo que el 1.4 compatible con `record_android 1.4.5`; el front-end
  # dart compila TODOS los federados (también linux) y el build rompía. Se
  # pincha el interface a 1.4.0, la serie con la que android+linux casan.
  # Versión mínima con record_linux 0.7.1 (0.7.2 exige un platform
  # interface ≥1.5 que rompe el front-end dart en build android: valida
  # TODOS los federados). 6.2.1 es la serie coherente android+linux+macos.
  record: ^6.2.1
  permission_handler: ^12.0.0
  share_plus: ^13.3.0
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2
  webview_flutter: ^4.14.1
  # Servidor HTTP local para el visor Screen: los módulos ES (index.html +
  # novnc.bundle.js) no cargan por file:// (CORS); se sirven por http.
  shelf: ^1.4.0
  shelf_static: ^1.1.0
  video_player: ^2.14.1
  audioplayers: ^6.8.1
  open_filex: ^4.7.0
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^19.0.0
  flutter_pdfview: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/screen/

  fonts:
    - family: JetBrainsMonoNerd
      fonts:
        - asset: fonts/JetBrainsMonoNerdFontMono-Regular.ttf
        - asset: fonts/JetBrainsMonoNerdFontMono-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMonoNerdFontMono-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMonoNerdFontMono-BoldItalic.ttf
          weight: 700
          style: italic
