name: hermes_pocket
description: "Hermes Pocket — cliente Android para Hermes Agent de Nous Research."
publish_to: 'none'
version: 0.1.13+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y arquitectura
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0

  # Red / protocolo
  dio: ^5.9.0
  web_socket_channel: ^3.0.0

  # Persistencia
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secretos
  flutter_secure_storage: ^10.0.0

  # Utilidades
  uuid: ^4.5.0
  intl: ^0.20.0
  collection: ^1.19.0
  meta: ^1.16.0
  dartssh2: ^4.1.0
  xterm2: ^5.2.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  gpt_markdown: ^1.3.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
