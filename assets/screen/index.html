<!DOCTYPE html>
<!--
  Visor Screen de Hermes (RFB/VNC sobre WebSocket) para Hermes Pocket.

  Reutiliza el MISMO visor que Hermes Desktop (noVNC 1.7.0, MIT) y el MISMO
  transporte: WebSocket hermana ws(s)://<gateway>/api/display/ws?display_ticket=…
  (apps/desktop screen-pane + sibling-ws-url; web_routers/display.py splices RFB).

  El lado Dart inyecta la configuración y recibe eventos por JavaScriptChannel
  (puedes ver `ScreenController` en lib/features/screen/screen_controller.dart).

  View-only: noVNC no envía keyboard/pointer; el gateway además gatea
  keyboard/pointer/clipboard por lease (RfbClientFilter, refresco 250 ms), así
  que incluso si algo se colara, el lease manda.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  #screen { width:100%; height:100%; }
  #msg {
    position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#9aa0a6; font:14px system-ui, sans-serif;
    text-align:center; padding:24px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="msg">Conectando…</div>
<!-- El bundle es un módulo ES con top-level await: sólo puede cargarse vía
     import. window.RFB se asigna al evaluarlo; el import espera a eso. -->
<script type="module">
const RFB = await import('./novnc.bundle.js').then(() => window.RFB);
let rfb = null;

function show(text) {
  document.getElementById('msg').style.display = 'flex';
  document.getElementById('msg').textContent = text;
}
function hide() { document.getElementById('msg').style.display = 'none'; }

// Mensaje de cierre → texto humano (los códigos son los de web_routers/display.py).
function closeText(code, reason) {
  if (reason === 'control-taken' || code === 4000) return 'Otro cliente tomó el control.';
  if (code === 4001) return 'El escritorio del bot se detuvo.';
  if (code === 4401) return 'Ticket de pantalla inválido o expirado.';
  if (code === 4403) return 'Sin permiso para ver esta pantalla.';
  return reason || ('Desconectado (' + code + ')');
}

function connect(cfg) {
  show('Conectando…');
  try {
    rfb = new RFB(document.getElementById('screen'), cfg.wsUrl, {
      shared: true,
      credentials: {},
      wsProtocols: [],
    });
  } catch (e) {
    show('No se pudo iniciar el visor: ' + e);
    emit(JSON.stringify({ event: 'error', message: String(e) }));
    return;
  }
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.viewOnly = !!cfg.viewOnly;
  rfb.background = '#000';

  rfb.addEventListener('connect', () => {
    hide();
    emit(JSON.stringify({ event: 'connected' }));
  });
  rfb.addEventListener('disconnect', (e) => {
    const d = e.detail || {};
    show(closeText(d.code, d.reason));
    emit(JSON.stringify({
      event: 'disconnected', code: d.code, reason: d.reason,
    }));
  });
  rfb.addEventListener('credentialsrequired', () => {
    emit(JSON.stringify({ event: 'credentialsrequired' }));
  });
  rfb.addEventListener('desktopname', (e) => {
    emit(JSON.stringify({
      event: 'desktopname', name: e.detail && e.detail.name,
    }));
  });
}

// Puente con Dart: webview_flutter inyecta window.ScreenBridge.postMessage(...).
function emit(payload) {
  if (window.ScreenBridge && window.ScreenBridge.postMessage) {
    window.ScreenBridge.postMessage(payload);
  } else {
    console.log(payload);
  }
}

// Arranque: Dart ejecuta `window.connectScreen({...})` vía runJavascript.
window.connectScreen = connect;
</script>
</body>
</html>
